env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json
env = mesa_glthread,true
env = GTK_USE_PORTAL,1
env = GTK_THEME,WhiteSur-Dark
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,mango
env = GDK_BACKEND,wayland,x11
env = GDK_SCALE,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_FORCE_DPI,142

env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = SDL_VIDEODRIVER,wayland

gappih=8
gappiv=8
gappoh=12
gappov=12
borderpx=0
border_radius=12
no_border_when_single=0
focuscolor=0x00000000

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile 
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

default_mfact=0.50
default_nmaster=1
new_is_master=0
tgmix_proportion=0.62
smartgaps=0

blur=0
blur_layer=0
blur_size=18
blur_passes=3
blur_ignore_opacity=0

shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=20
shadows_blur=25
shadows_position_x=0
shadows_position_y=4
shadowscolor=0x00000028

animations=0
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0

zoom_initial_ratio=0.92
zoom_end_ratio=1.0

animation_duration_open=180
animation_duration_close=140
animation_duration_move=300
animation_duration_tag=160

animation_curve_open=0.16,1.0,0.3,1.05
animation_curve_close=0.4,0.0,0.8,1.0
animation_curve_move=0.25,0.46,0.45,1.0
animation_curve_tag=0.25,0.46,0.45,1.0

tag_animation_direction=1

repeat_rate=80
repeat_delay=130
numlockon=1
xkb_rules_layout=us
xkb_rules_variant=,
xkb_rules_options=grp:alt_space_toggle
sloppyfocus=1
warpcursor=0
tap_to_click=1
disable_while_typing=1


disable_trackpad=0
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0


bind=SUPER,Return,spawn,foot
bind=SUPER,f,spawn,firefox
bind=SUPER,e,spawn,nautilus
bind=SUPER,Backspace,spawn,~/.config/mango/wlogout.sh
bind=SUPER,c,spawn,wezterm -e nvim
bind=SUPER,m,spawn,cider
bind=SUPER,a,spawn,/home/moon/.config/rofi/launchers/type-2/launcher.sh || pkill rofi
bind=SUPER,s,spawn,/home/moon/.config/mango/snip.sh
bind=SUPER,R,spawn,/home/moon/.config/mango/rebar.sh
bind=SUPER,d,spawn,easyeffects
bind=SUPER+SHIFT,e,spawn,foot -e yazi
bind=SUPER+SHIFT,d,spawn,nwg-displays
bind=SUPER+SHIFT,b,spawn,foot -e btop
bind=SUPER+SHIFT,g,spawn,foot -e lazygit
bind=SUPER,v,spawn,bash -c "cliphist list | rofi -dmenu | cliphist decode | wl-copy"

# screenshotting
#bind=NONE,Print,spawn,~/.config/mango/screenshot.sh copy
bind=SHIFT,Print,spawn,~/.config/mango/screenshot.sh area
bind=CTRL,Print,spawn,~/.config/mango/screenshot.sh monitor
bind=ALT,Print,spawn,~/.config/mango/screenshot.sh all

bind=SUPER,q,killclient
bind=SUPER,i,incnmaster,+1
bind=SUPER,p,incnmaster,-1
bind=SUPER,n,switch_layout

bind=SUPER+SHIFT,r,reload_config
bind=Alt,Return,togglefullscreen
bind=SUPER,space,togglefloating

bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down 

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev

bind=SUPER+SHIFT,left,resizewin,-20,0
bind=SUPER+SHIFT,right,resizewin,20,0
bind=SUPER+SHIFT,up,resizewin,0,-20
bind=SUPER+SHIFT,down,resizewin,0,20

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# smartmovewin
bind=CTRL+SHIFT,k,smartmovewin,up
bind=CTRL+SHIFT,j,smartmovewin,down
bind=CTRL+SHIFT,h,smartmovewin,left
bind=CTRL+SHIFT,l,smartmovewin,right

# Media keys (playerctl is installed, not bound)
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioStop,spawn,playerctl stop

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER,0,toggleoverview

# 3-finger swipe — switch tags (even empty ones)
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft

# 4-finger swipe — move window to adjacent tag + follow
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client

# brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 4%-
# Volume 
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer -i 2
bind=NONE,XF86AudioLowerVolume,spawn,pamixer -d 5
bind=NONE,XF86AudioMute,spawn,pamixer -t

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

layerrule = no_anim on, namespace:^quickshell$

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

