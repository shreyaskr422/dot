[main]
dpi-aware=yes
font=DankMono Nerd Font Mono:size=12
letter-spacing=0.4
pad=20x20
dpi-aware=yes
term=xterm-256color
bold-text-in-bright=yes

[scrollback]
lines=5000

[url]
launch=xdg-open
osc8-underline=always

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.9

[colors-dark]
alpha=0.9

foreground=d6f0f0        # softer icy white
background=0b0f14        # deeper to match mountains

# Normal
regular0=0b0f14
regular1=e35d4f          # slightly warmer red (contrast)
regular2=3fd1b3          # matches sky teal
regular3=f0c674          # soft warm highlight
regular4=3a8fb7          # sky blue tone
regular5=7a88b8          # subtle purple-blue
regular6=4fc1e8          # brighter cyan (sky highlight)
regular7=d6f0f0

# Bright (pop more like stars)
bright0=1a2630
bright1=ff7a6a
bright2=5fffd7
bright3=ffd98e
bright4=5fb3d9
bright5=a0a8d0
bright6=7fe7ff
bright7=ffffff

# Selection (matches sky depth)
selection-foreground=d6f0f0
selection-background=12384a

# Cursor (clean glacier look)
cursor=0b0f14 4fc1e8
