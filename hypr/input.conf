# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    numlock_by_default = true
    repeat_rate = 60
    repeat_delay = 150
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        tap-to-click = true
	disable_while_typing = true
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
    inactive_timeout = 10
    no_hardware_cursors = false
}


