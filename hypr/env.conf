### ENVIRONMENT VARIABLES  ###

# Cursor and basic UI variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Optimization for AMD Vega iGPU
#env = AMD_DEBUG,nogns
#env = WLR_DRM_NO_ATOMIC,1

# ── HYBRID GPU ───────────────────────────────────────────────────────────────
# card0 = AMD 780M (display GPU) | card1 = RTX 5050 (offload/gaming)
# Verified via: cat /sys/class/drm/card0/device/vendor → 0x1002 (AMD)
#               cat /sys/class/drm/card1/device/vendor → 0x10de (Nvidia)
# AMD first = primary renderer (battery + display)
# Nvidia second = available for offload, external monitor if needed
#env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
#env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:6a:00.0-card:/dev/dri/by-path/pci-0000:01:00.0-card

# Force EGL to use Mesa on hybrid — prevents Hyprland accidentally using Nvidia EGL
# for compositor rendering (confirmed fix for hybrid setups per Hyprland discussions)
env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/50_mesa.json

# ── NVIDIA ───────────────────────────────────────────────────────────────────
# Tells GLX (OpenGL over X11 / XWayland) to use Nvidia for apps that need it
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# XWayland must use Mesa globally (NVIDIA only for offloaded games)# XWayland must use Mesa globally (NVIDIA only for offloaded games)
env = __GLX_VENDOR_LIBRARY_NAME,mesa

# VRR + G-Sync allow (Nvidia side) — works alongside misc.vrr in general.conf
env = __GL_VRR_ALLOWED,1
env = __GL_GSYNC_ALLOWED,1

#env = GBM_BACKEND,nvidia-drm
#env = LIBVA_DRIVER_NAME,nvidia
#env = __NV_PRIME_RENDER_OFFLOAD,1
#env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER,NVIDIA-G0

# PRIME offload — keep commented. Uncomment PER APP launch, not globally.
# Usage: __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia <app>
#env = __NV_PRIME_RENDER_OFFLOAD,1
#env = __NV_PRIME_RENDER_OFFLOAD_PROVIDER,NVIDIA-G0

# ── VA-API (HARDWARE VIDEO DECODE) ───────────────────────────────────────────
# Display GPU is AMD 780M → VA-API must use radeonsi
# Setting nvidia here = broken hardware decode on your setup
env = LIBVA_DRIVER_NAME,radeonsi

# ── MESA / AMD PERFORMANCE ───────────────────────────────────────────────────
# Threaded OpenGL — offloads GL driver work to separate CPU thread
# Free perf for any GL-based game or app, no downsides
env = mesa_glthread,true

# ── WAYLAND SESSION ──────────────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Wayland backend compatibility layer
# GTK: Wayland first, X11 fallback, then anything else
env = GDK_BACKEND,wayland,x11,*
# SDL2: Wayland. If an old game breaks, launch it with SDL_VIDEODRIVER=x11 %command%
env = SDL_VIDEODRIVER,wayland
# Clutter (rare, GNOME legacy apps)
env = CLUTTER_BACKEND,wayland

#QT APPS
# wayland;xcb = Wayland with X11 fallback (semicolon = correct Qt syntax) 
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

#GTK APPS
env = GTK_THEME,WhiteSur-Dark-grey

#Electron Apps
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Chromium browsers
env = CHROMIUM_FLAGS,--ozone-platform=wayland --enable-features=WaylandWindowDecorations

# Firefox
env = MOZ_ENABLE_WAYLAND,1
# Disables RDD sandbox — fixes hardware decode on some setups, safe to keep
env = MOZ_DISABLE_RDD_SANDBOX,1

# Flatpak
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
