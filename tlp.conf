# General
PLATFORM_PROFILE_ON_AC=performance
TLP_ENABLE=1
TLP_DEFAULT_MODE=AC              # Force battery-like savings even on AC if needed (optional, comment out if unwanted)

# CPU (your aliases can still override these manually)
CPU_SCALING_GOVERNOR_ON_AC=performance     # Balanced on plugged in
CPU_SCALING_GOVERNOR_ON_BAT=powersave    # Matches your battery alias

CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0        # Disable turbo on battery → big power saver
CPU_HWP_DYNAMIC_BOOST_ON_BAT=0   # extra AMD saving

# ──────────────────────────────────────────────────────────────
# PCIe & Runtime PM (critical for NVIDIA dGPU to sleep properly)
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto           # Enables PCI(e) runtime power management → NVIDIA can reach low power states

PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave  # Most aggressive ASPM on battery

CPU_BOOST_ON_AC=1

# Optional: If NVIDIA still doesn't sleep well, add its PCI address to always enable runtime PM
# Get ID with: lspci | grep NVIDIA → e.g. 01:00.0
RUNTIME_PM_ENABLE="01:00.0"

# USB & Other Devices
USB_AUTOSUSPEND=1                # Autosuspend USB devices on battery
USB_EXCLUDE_BTUSB=0              # Don't autosuspend Bluetooth if you use it

# Audio / Other
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0                      # Helps in some hybrid setups to avoid keeping dGPU awake
SOUND_POWER_SAVE_CONTROLLER="Y"                # already set

# Optional: If you rarely use Bluetooth, disable it on battery
DEVICES_TO_DISABLE_ON_BAT="bluetooth"

# Optional: If you want even lower power on battery (experimental)
PLATFORM_PROFILE_ON_BAT=low-power              # more aggressive than balanced

# Keep USB autosuspend ON for other devices (like your webcam)
USB_AUTOSUSPEND_ON_AC=0
USB_AUTOSUSPEND_ON_BAT=1

# EXCLUDE the Moondrop Dawn Pro from power saving (using its ID: 2fc6:f06a)
USB_DENYLIST="2fc6:f06a 17ef:60d1"

# Radio / Network
DEVICES_TO_DISABLE_ON_STARTUP="" # Leave empty unless you want to disable WiFi/Bluetooth on boot
